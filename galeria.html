<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construções</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; background:#111; color:#eee; }
  h1 { font-size: 22px; }
  nav { margin-bottom: 20px; }
  a { color:#7fc8ff; }
  .card { border:1px solid #444; margin-bottom:28px; padding:16px; border-radius:6px; background:#181818; }
  .card h2 { margin: 0 0 4px 0; font-size: 18px; }
  .card .autor { color:#9ccc65; font-size: 13px; margin-bottom: 8px; }
  .card p.desc { color:#ccc; margin-bottom: 12px; }
  iframe.preview { width:100%; max-width:520px; height:320px; border:1px solid #333; background:#000; border-radius:4px; }
  #carregando { color:#999; }
  #erro { color:#e57373; }
  .copiar-box { margin-top: 40px; }
  textarea#scriptFinal { width:100%; height:200px; font-family: monospace; background:#1c1c1c; color:#c5e1a5; border:1px solid #444; }
</style>
</head>
<body>

<nav><a href="index.html">← Enviar nova construção</a></nav>

<h1>Construções enviadas</h1>
<p id="carregando">Carregando...</p>
<p id="erro" style="display:none">Não foi possível carregar a lista de construções ainda.</p>
<div id="lista"></div>

<div class="copiar-box">
  <h2>Script completo atualizado</h2>
  <p>Copie o texto abaixo e cole no editor de módulos do Transformice.</p>
  <textarea id="scriptFinal" readonly></textarea>
  <button onclick="copiarScript()">Copiar script</button>
</div>

<script>
  // troque pelo caminho do seu repositório, ex: "joaosilva/construcoes-tfm"
  const REPO = "SEU_USUARIO/SEU_REPO";
  const BRANCH = "main";
  const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;

  async function carregar() {
    const container = document.getElementById('lista');
    const carregando = document.getElementById('carregando');
    const erroEl = document.getElementById('erro');

    try {
      const indice = await fetch(RAW_BASE + 'constructions/index.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('sem index.json ainda');
        return r.json();
      });

      carregando.style.display = 'none';

      if (indice.length === 0) {
        container.innerHTML = '<p>Nenhuma construção enviada ainda.</p>';
      }

      for (const item of indice) {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <h2>${item.name}</h2>
          <div class="autor">Enviado por: ${item.author}</div>
          <p class="desc">${item.description}</p>
          <iframe class="preview" src="preview/index.html#minimal"></iframe>
        `;
        container.appendChild(div);

        const iframe = div.querySelector('iframe');
        fetch(RAW_BASE + item.xmlFile, { cache: 'no-store' })
          .then(r => r.text())
          .then(xml => {
            iframe.addEventListener('load', () => {
              const tryImport = () => {
                const w = iframe.contentWindow;
                if (w && w.importXML) {
                  w.showGameGUI.set(false);
                  w.importXML(xml);
                } else {
                  setTimeout(tryImport, 50);
                }
              };
              tryImport();
            });
            // se já carregou antes do fetch terminar, dispara na mão
            if (iframe.contentWindow && iframe.contentWindow.importXML) {
              iframe.contentWindow.showGameGUI.set(false);
              iframe.contentWindow.importXML(xml);
            }
          });
      }
    } catch (e) {
      carregando.style.display = 'none';
      erroEl.style.display = 'block';
    }
  }

  async function carregarScript() {
    try {
      const texto = await fetch(RAW_BASE + 'script-completo.lua', { cache: 'no-store' }).then(r => r.text());
      document.getElementById('scriptFinal').value = texto;
    } catch (e) {
      document.getElementById('scriptFinal').value = 'Ainda não há um script gerado (envie a primeira construção).';
    }
  }

  function copiarScript() {
    const area = document.getElementById('scriptFinal');
    area.select();
    document.execCommand('copy');
    alert('Script copiado!');
  }

  carregar();
  carregarScript();
</script>

</body>
</html>
